server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The browser talks to one origin; API calls go to the service container.
    location /api/ {
        proxy_pass http://service:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri /index.html;
    }
}
