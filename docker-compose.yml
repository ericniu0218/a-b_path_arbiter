# One command to run the whole thing:  docker compose up --build
# The database password below is for local development only.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: feedlab
      POSTGRES_USER: feedlab
      POSTGRES_PASSWORD: feedlab
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedlab -d feedlab"]
      interval: 3s
      timeout: 3s
      retries: 20

  service:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      FEEDLAB_DB_URL: jdbc:postgresql://db:5432/feedlab
      FEEDLAB_DB_USER: feedlab
      FEEDLAB_DB_PASSWORD: feedlab
      FEEDLAB_DATA_DIR: /data
    volumes:
      - ./data:/data:ro
    ports:
      - "${FEEDLAB_PORT:-8080}:8080"

volumes:
  dbdata:
